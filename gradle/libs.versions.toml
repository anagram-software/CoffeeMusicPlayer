[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"

# AndroidX
appcompat = "1.8.0"
cardview = "1.0.0"
constraintlayout = "2.2.2"
core-ktx = "1.19.1"
documentfile = "1.1.0"
drawerlayout = "1.2.0"
fragment = "1.9.1"
gridlayout = "1.1.0"
lifecycle = "2.11.0"
localbroadcastmanager = "1.1.0"
media = "1.8.0"
navigation = "2.10.2"
palette = "1.1.0"
preference = "1.2.1"
recyclerview = "1.4.0"
transition = "1.7.2"
viewpager = "1.1.0"
material = "1.14.0"
room = "2.8.5"

# Third party (replaced in later phases)
koin = "4.2.2"
glide = "4.6.1"
permiso = "0.3.0"
rxandroid = "2.1.1"
rxjava = "2.2.8"
rxkotlin = "2.2.0"
sqlbrite = "2.0.0"
annimon-stream = "1.1.7"
rxbroadcast = "2.0.0"
rxbinding = "2.0.0"
retrofit = "2.3.0"
okhttp = "3.10.0"
gson = "2.8.5"
jsoup = "1.10.2"

slidinguppanel = "3.3.1"

junit = "4.13.2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-gridlayout = { module = "androidx.gridlayout:gridlayout", version.ref = "gridlayout" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-palette = { module = "androidx.palette:palette", version.ref = "palette" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-rxjava2 = { module = "androidx.room:room-rxjava2", version.ref = "room" }
androidx-transition = { module = "androidx.transition:transition", version.ref = "transition" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
material = { module = "com.google.android.material:material", version.ref = "material" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
permiso = { module = "com.greysonparrelli.permiso:permiso", version.ref = "permiso" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid" }
rxjava = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava" }
rxkotlin = { module = "io.reactivex.rxjava2:rxkotlin", version.ref = "rxkotlin" }
sqlbrite = { module = "com.squareup.sqlbrite2:sqlbrite", version.ref = "sqlbrite" }
annimon-stream = { module = "com.annimon:stream", version.ref = "annimon-stream" }
rxbroadcast = { module = "com.cantrowitz:rxbroadcast", version.ref = "rxbroadcast" }
rxbinding-appcompat = { module = "com.jakewharton.rxbinding2:rxbinding-appcompat-v7-kotlin", version.ref = "rxbinding" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-adapter-rxjava2 = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
slidinguppanel = { module = "com.sothree.slidinguppanel:library", version.ref = "slidinguppanel" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
